name: Refresh live fantasy data

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write


jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore Sleeper player metadata
        id: player-cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: sleeper-players-${{ github.run_id }}
          restore-keys: sleeper-players-

      - name: Fetch live data
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: |
          node --version
          mkdir -p .cache
          if [ ! -f .cache/sleeper-players.json ]; then
            curl --fail --silent --show-error --location --max-time 30 "https://api.sleeper.app/v1/players/nfl" -o .cache/sleeper-players.json
          fi
          node scripts/fetch-live-data.mjs
          rm -rf .cache
        timeout-minutes: 5

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

# ChalupaFF manual restart 2026-10-04T17:16:44.288Z

      - name: Wait before next refresh
        if: ${{ always() }}
        run: sleep 270

      - name: Start next refresh
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run live-data.yml --repo "${{ github.repository }}" --ref main

